<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-white text-black">
  <main class="flex min-h-screen items-center justify-center px-6 py-12">
    <section class="w-full max-w-sm">
      <header class="mb-10">
        <p class="mb-8 text-sm font-bold uppercase tracking-widest">Local workspace</p>
        <h1 class="text-3xl font-semibold tracking-tight">Sign in</h1>
        <p class="mt-2 text-sm text-neutral-500">Welcome back. Enter your details below.</p>
      </header>

      <form id="login" class="space-y-5">
        <label class="block">
          <span class="mb-2 block text-sm font-medium">Email</span>
          <input name="email" type="text" autocomplete="email"
            class="w-full border border-neutral-300 px-3 py-3 text-sm outline-none transition focus:border-black">
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-medium">Password</span>
          <input name="password" type="password" autocomplete="current-password"
            class="w-full border border-neutral-300 px-3 py-3 text-sm outline-none transition focus:border-black">
        </label>
        <button class="w-full bg-black px-4 py-3 text-sm font-semibold text-white transition hover:bg-neutral-800">Sign in</button>
      </form>

      <p id="out" role="status" class="mt-4 min-h-5 text-sm text-red-700"></p>
      <p class="mt-8 border-t border-neutral-200 pt-6 text-center text-sm text-neutral-500">
        New here? <a href="/signup.html" class="font-semibold text-black underline underline-offset-4">Create an account</a>
      </p>
    </section>
  </main>
  <script>
    const form = document.getElementById('login');
    const button = form.querySelector('button');
    const output = document.getElementById('out');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      button.disabled = true;
      button.textContent = 'Signing in...';
      output.textContent = '';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Invalid email or password.');
        window.location.href = '/dashboard.html';
      } catch (error) {
        output.textContent = error.message || 'Unable to sign in. Try again.';
        button.disabled = false;
        button.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
