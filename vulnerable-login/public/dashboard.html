<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-white text-black">
  <main class="mx-auto max-w-4xl px-6 py-8 sm:px-10">
    <header class="flex items-center justify-between border-b border-black pb-6">
      <a href="/dashboard.html" class="text-sm font-bold uppercase tracking-widest">Dashboard</a>
      <span class="text-sm text-neutral-500">Local workspace</span>
    </header>

    <section class="border-b border-neutral-200 py-10">
      <p class="text-sm text-neutral-500">Overview</p>
      <h1 id="who" class="mt-2 text-3xl font-semibold tracking-tight">Loading...</h1>
    </section>

    <div class="grid gap-12 py-10 md:grid-cols-[1fr_240px]">
      <section>
        <h2 class="text-xl font-semibold">Profile</h2>
        <p class="mt-1 text-sm text-neutral-500">Update the details shown on your public profile.</p>
        <form id="profileForm" class="mt-8 space-y-5">
          <label class="block">
            <span class="mb-2 block text-sm font-medium">Display name</span>
            <input name="name" class="w-full border border-neutral-300 px-3 py-3 text-sm outline-none focus:border-black">
          </label>
          <label class="block">
            <span class="mb-2 block text-sm font-medium">Bio</span>
            <textarea name="bio" rows="6" class="w-full resize-none border border-neutral-300 px-3 py-3 text-sm outline-none focus:border-black"></textarea>
          </label>
          <div class="flex items-center gap-4">
            <button class="bg-black px-5 py-3 text-sm font-semibold text-white transition hover:bg-neutral-800">Save profile</button>
            <p id="msg" role="status" class="text-sm"></p>
          </div>
        </form>
      </section>

      <aside class="border-t border-neutral-200 pt-8 md:border-l md:border-t-0 md:pl-8 md:pt-0">
        <h2 class="text-sm font-semibold uppercase tracking-wider">Links</h2>
        <a id="viewLink" href="#" target="_blank" rel="noopener" class="mt-5 block text-sm underline underline-offset-4">View public profile</a>
      </aside>
    </div>
  </main>

  <script>
    const profileForm = document.getElementById('profileForm');
    const saveButton = profileForm.querySelector('button');
    const message = document.getElementById('msg');

    async function load() {
      try {
        const res = await fetch('/me');
        if (!res.ok) {
          window.location.href = '/signin.html';
          return;
        }
        const me = await res.json();
        document.getElementById('who').textContent = 'Signed in as ' + me.email;
        profileForm.elements.name.value = me.name || '';
        profileForm.elements.bio.value = me.bio || '';
        document.getElementById('viewLink').href = '/profile/' + me.id;
      } catch (error) {
        document.getElementById('who').textContent = 'Unable to load your profile.';
        message.textContent = 'Check that the local server is running and refresh the page.';
      }
    }

    profileForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      saveButton.disabled = true;
      saveButton.textContent = 'Saving...';
      message.textContent = '';

      try {
        const res = await fetch('/bio', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(profileForm))),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Unable to save profile.');
        message.textContent = data.message || 'Profile saved.';
      } catch (error) {
        message.textContent = error.message || 'Unable to save profile. Try again.';
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = 'Save profile';
      }
    });

    load();
  </script>
</body>
</html>
